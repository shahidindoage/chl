<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <!--
      SEO notes live in src/lib/seo.data.json and are applied per route by
      src/hooks/useSeo.ts at runtime, then baked into static HTML by
      scripts/prerender.mjs after each build. Nothing SEO-related belongs in
      this file — it is only ever the fallback for the bare dev server.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Body text only. Headings use the self-hosted Druk faces declared in
         src/styles.css, so Playfair Display is no longer requested. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Druk is in use above the fold: warm the first faces early. -->
    <link rel="preload" href="/fonts/DrukText-Heavy-Trial.otf" as="font" type="font/otf" crossorigin />
    <link rel="preload" href="/fonts/DrukText-Bold-Trial.otf" as="font" type="font/otf" crossorigin />
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-EM6FW5S1FQ"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-EM6FW5S1FQ');
    </script>
  </head>
  <body class="bg-pitch-cream text-slate-900 antialiased selection:bg-pitch-orange selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
